<!-- Simulates a strType=2 (artist) TJ response for query "아이유" where TJ
     resolves the Korean query to a song whose *displayed* artist is the
     English stage name "IU" - not a literal match against "아이유" at all.
     Exercises that rankBySource trusts the ARTIST category as a relevance
     signal by itself, rather than re-checking the artist string. -->
<html>
<body>
<div class="music-search-list type2">
  <h2>가수</h2>
  <ul class="chart-list-area music type-a type-b">
    <li>
      <ul class="grid-container list ico">
        <li class="grid-item center pos-type"><p class="count"><span class="mo-title">곡번호</span><span class="num2">60001</span></p></li>
        <li class="grid-item title3">
          <div class="flex-box ico-flex">
            <ul><li><p class="no-ico"></p></li></ul>
            <p class=""><span>Blueming</span></p>
          </div>
        </li>
        <li class="grid-item title4 singer"><p><span>IU</span></p></li>
        <li class="grid-item title5"><p><span class="">Lyricist F</span></p></li>
        <li class="grid-item title6"><p><span class="">Composer F</span></p></li>
      </ul>
    </li>
  </ul>
</div>
</body>
</html>
